{% extends "base.html" %}
{% block title %}{{ 'Edit' if course.id else 'Add' }} course{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 640px"><div class="card-body p-4">
  <h4 class="fw-bold mb-3">{{ 'Edit course' if course.id else 'Add a course' }}</h4>
  <form method="post">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Course code</label>
        <input name="code" class="form-control" value="{{ course.code or '' }}" placeholder="MAD1" required>
      </div>
      <div class="col-md-8">
        <label class="form-label">Course name</label>
        <input name="name" class="form-control" value="{{ course.name or '' }}" required>
      </div>
      <div class="col-12">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="3">{{ course.description or '' }}</textarea>
      </div>
      <div class="col-md-4">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
          {% for status in ['Active', 'Inactive'] %}
            <option {{ 'selected' if course.status == status }}>{{ status }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="mt-4">
      <button class="btn btn-primary">Save course</button>
      <a href="{{ url_for('admin.courses') }}" class="btn btn-link">Cancel</a>
    </div>
  </form>
</div></div>
{% endblock %}
