{% extends "base.html" %}
{% block title %}Edit slot{% endblock %}
{% block content %}
<div class="card auth-card"><div class="card-body p-4">
  <h4 class="fw-bold mb-1">Edit slot</h4>
  <p class="text-muted">{{ slot.exam.name }}</p>
  <form method="post">
    <div class="mb-3"><label class="form-label">Date</label>
      <input type="date" name="date" class="form-control" value="{{ slot.date }}" required></div>
    <div class="row g-2 mb-3">
      <div class="col"><label class="form-label">Start time</label>
        <input type="time" name="start_time" class="form-control" value="{{ slot.start_time.strftime('%H:%M') }}" required></div>
      <div class="col"><label class="form-label">End time</label>
        <input type="time" name="end_time" class="form-control" value="{{ slot.end_time.strftime('%H:%M') }}" required></div>
    </div>
    <div class="mb-3"><label class="form-label">Maximum students</label>
      <input type="number" name="capacity" min="1" class="form-control" value="{{ slot.capacity }}" required></div>
    <button class="btn btn-primary">Save slot</button>
    <a href="{{ url_for('examiner.exam_page', exam_id=slot.exam_id) }}" class="btn btn-link">Cancel</a>
  </form>
</div></div>
{% endblock %}
