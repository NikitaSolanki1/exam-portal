{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card auth-card"><div class="card-body p-4">
  <h4 class="fw-bold mb-1">Create an account</h4>
  <p class="text-muted">Examiner accounts need admin approval before login.</p>
  <form method="post">
    <div class="mb-3">
      <label class="form-label">I am a</label>
      <select name="role" class="form-select" required>
        <option value="student">Student</option>
        <option value="examiner">Examiner</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Full name</label>
      <input name="name" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" minlength="4" required>
    </div>
    <div class="row g-2 mb-3">
      <div class="col">
        <label class="form-label">Phone</label>
        <input name="phone" class="form-control">
      </div>
      <div class="col">
        <label class="form-label">Department</label>
        <input name="department" class="form-control">
      </div>
    </div>
    <button class="btn btn-primary w-100">Register</button>
  </form>
  <p class="text-center mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</div></div>
{% endblock %}
